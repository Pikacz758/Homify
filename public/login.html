<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/login-style.css">
    <title>Homify | login</title>
</head>
<body>
    <div class="login_panel">
        <div class="header">
            <p class="header-text">Login Panel</p>
        </div> 
        <div class="panel">
            <input type="text" id="username-login" class="username-login" placeholder="Username">
            <input type="password" name="passwd" id="password-login"class="password-login" placeholder="Password">
            <button type="button" class="button-login" onclick="login()" >Login</button>
            
        </div>
    </div>
    <script src="static/js/app.js"></script>
</body>
</html>
